    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : systemDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

  <body>
    <script>
      // Immediately restore scroll on page reload before DOM paint
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      try {
        const hash = window.location.hash;
        const saved = sessionStorage.getItem('portfolio_active_section');
        const id = (hash ? hash.replace('#', '') : '') || (saved && saved !== 'home' ? saved : '');
        if (id && id !== 'home') {
          const restore = () => {
            const el = document.getElementById(id);
            if (el) {
              el.scrollIntoView({ behavior: 'instant', block: 'start' });
            }
          };
          restore();
          window.addEventListener('DOMContentLoaded', restore);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
